<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperMock v3 Slides</title>
<meta name="description" content="How the SuperMock v3 synthetic SPHEREx sky is built from the LastJourney simulation, and what the final dataset reproduces.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="assets/deck.css">
</head>
<body>
<div id="stage">
  <div id="deck" aria-live="polite"></div>
</div>
<nav id="hud">
  <button id="prev" aria-label="Previous slide">&#8592;</button>
  <span id="counter">&nbsp;</span>
  <button id="next" aria-label="Next slide">&#8594;</button>
  <button id="grid-btn" aria-label="Overview" title="Overview (o)">&#9638;</button>
</nav>
<div id="overview" class="hidden" role="dialog" aria-label="All slides"></div>
<div id="loading">Loading slides&hellip;</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="assets/deck.js"></script>
</body>
</html>
